apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-task-board
  labels:
    app: campus-task-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-task-board
  template:
    metadata:
      labels:
        app: campus-task-board
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      # For a private registry, create the secret in this namespace and uncomment:
      # imagePullSecrets:
      #   - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: campus-task-board:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "1.0.0"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
